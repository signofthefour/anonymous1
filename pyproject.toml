[project]
name = "mamtra"
version = "0.1.0"
description = "Text-to-speech by Zyphra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "setuptools",
    "packaging",
    "inflect>=7.5.0",
    "kanjize>=1.5.0",
    "numpy>=2.2.2",
    "phonemizer>=3.3.0",
    "sudachidict-full>=20241021",
    "sudachipy>=0.6.10",
    "torchaudio>=2.5.1",
    "transformers==4.51.3",
    "soundfile>=0.13.1",
    "huggingface-hub>=0.28.1",
    "gradio>=5.15.0",
    "hyperpyyaml>=1.2.3",
    "modelscope>=1.34.0",
    "omegaconf>=2.3.0",
    "onnxruntime==1.23.2",
    "openai-whisper>=20250625",
    "wetextprocessing>=1.0.4.1",
    "scipy>=1.15.3",
    "deepspeed>=0.18.7",
    "tensorboard>=2.20.0",
    "conformer>=0.3.2",
    "diffusers>=0.37.0",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "gdown>=5.2.1",
    "matplotlib>=3.10.8",
    "wget>=3.2",
    "librosa>=0.11.0",
    "pyarrow>=23.0.1",
    "pyworld>=0.3.5",
]

# These are technically optional, but mamba-ssm is required to run hybrid models.
[project.optional-dependencies]
compile = [
    "flash-attn>=2.7.3",
    "mamba-ssm>=2.2.4",
    "causal-conv1d>=1.5.0.post8",
]

[tool.setuptools.packages.find]
include = ["mamtra"]

[tool.uv]
no-build-isolation-package = ["flash-attn", "mamba-ssm", "causal-conv1d"]

[tool.ruff]
line-length = 120
